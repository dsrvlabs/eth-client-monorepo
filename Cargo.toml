[workspace]
resolver = "3"
members = [
  "crates/types",
  "crates/crypto",
  "crates/proto",
  "crates/bootstrap",
  "crates/config",
  "services/chain",
  "services/p2p",
  "services/attestation",
  "services/engine",
  "services/beacon-api",
  "services/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/dsrvlabs/eth-client-monorepo"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[workspace.dependencies]
# Internal crates
cc-types = { path = "crates/types" }
cc-crypto = { path = "crates/crypto" }
cc-proto = { path = "crates/proto" }
cc-bootstrap = { path = "crates/bootstrap" }
cc-config = { path = "crates/config" }

# External pins (Architecture §2.3 / §3.4 / §10, CC-02)
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"
prost = "0.14.4"
protox = "0.9.1"

# Config loader (Architecture §5 / ADR-12, CC-09a)
figment = { version = "0.10.19", features = ["env", "toml"] }
http = "1.5.0"
serde = { version = "1.0.219", features = ["derive"] }

# Service binaries (CC-01b)
anyhow = "1.0.100"

# Bootstrap telemetry (Architecture §4 / ADR-06, CC-05a)
prometheus-client = "0.25.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
hyper = { version = "1.11.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body = "1.1.0"
http-body-util = "0.1.4"
bytes = "1.12.1"
pin-project-lite = "0.2.17"
futures = "0.3.33"

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 16
panic = "unwind"
overflow-checks = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
debug = 2
