[package]
name = "cc-libp2p"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Sole workspace member allowed to declare a libp2p* dependency (CC-20/1, CC-2K).
# Zero workspace (cc-*) dependencies permanently (Architecture §1.2 / D-9 freeze prep).
libp2p = { workspace = true }
snap = { workspace = true }
futures = { workspace = true }
# Message-id default (eth2 Altair+ preimage) — SEC C1; no cc-* deps.
sha2 = { workspace = true }
# TTFB / RESP timeouts inside the live req/resp codec (CC-23a / §7.2).
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
