# Local-dev defaults for `driver` (Architecture §9, CC-1Aa).
# Compose overrides via CC_DRIVER_* environment variables.
# Scaffold removed with bin/driver/ at CC-28.

# Driver is not a gRPC server; grpc_addr is required by ServiceConfig only.
grpc_addr = "127.0.0.1:9010"
metrics_addr = "127.0.0.1:9110"
log_format = "json"
log_filter = "info"

# Ordered beacon-API provider base URLs.
# Enforced (SEC-1Aa-3): https:// only, except http:// to loopback for tests.
# Redirects that leave that policy are refused.
beacon_providers = []

# Eth-Consensus-Version → ImportBlockRequest.fork default when the response
# header is absent (Phase 1: fulu).
default_fork = "fulu"

# Catch-up fetch pipeline depth (§9.2). Imports remain strictly sequential.
prefetch_depth = 8

# gRPC peer: chain ImportBlock / GetHead.
[peers]
chain = "http://127.0.0.1:9001"
