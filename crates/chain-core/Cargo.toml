[package]
name = "cc-chain-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# S0-A-31 / R-13(b) only. Never default; never on the production binary.
s0-a-31-observe = []

[dependencies]
# S2-A-03: production compile of the moved siblings. No HTTP client. No JWT
# signer ([ARCH] §6.2 / S2-A-01). S2-A-04: `Arc<dyn ArchiveWrite>` via
# cc-seam. Never a storage type.
arc-swap = { workspace = true }
bytes = { workspace = true }
cc-bootstrap = { workspace = true }
cc-crypto = { workspace = true }
cc-engine-api = { workspace = true }
cc-fork-choice = { workspace = true }
cc-proto = { workspace = true }
cc-scheduler = { workspace = true }
cc-seam = { workspace = true }
cc-state-transition = { workspace = true }
cc-types = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
prometheus-client = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true }
tracing = { workspace = true }
tree_hash = { workspace = true }

[dev-dependencies]
cc-crypto = { workspace = true, features = ["signing"] }
prost = { workspace = true }
serde_json = { workspace = true }
ssz_types = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
