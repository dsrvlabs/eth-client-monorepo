# Local-dev defaults for `p2p` (Architecture §6.3 / §6.5).
# Compose overrides via CC_P2P_* environment variables.

grpc_addr = "127.0.0.1:9002"
metrics_addr = "127.0.0.1:9102"
log_format = "json"
log_filter = "info"

# CC-20b: persisted secp256k1 node key (custody input). Mode 0600.
node_key_path = "./data/node_key"
# libp2p listen (discovery dials via peer manager, CC-21c).
listen_multiaddr = "/ip4/0.0.0.0/tcp/9000"

# Hoodi network config + GVR for ENR eth2 / fork digest (CC-21b/c).
network_config = "crates/types/tests/fixtures/hoodi-config.yaml"
genesis_validators_root = "0x212f13fc4df078b6cb7db228f1c8307566dcecf900867401a92023d7ba99cb5f"
enable_discovery = true

[clock]
# Until the first ChainView (CC-27a), slot clock is config-sourced.
# Hoodi genesis_time = MIN_GENESIS_TIME(1742212800) + GENESIS_DELAY(600).
genesis_time = 1742213400
seconds_per_slot = 12
slots_per_epoch = 32
# MAXIMUM_GOSSIP_CLOCK_DISPARITY — read by clock.rs; never hard-coded there.
maximum_gossip_clock_disparity_ms = 500
slot_clock_offset_seconds = 0

[peers]
chain = "http://127.0.0.1:9001"

# CC-20c peer-manager knobs (defaults; static peers empty until operators set them).
[peer_manager]
target_peers = 50
max_peers = 100
max_inbound = 60
max_outbound = 60
max_concurrent_dials = 8
# static_peers = []  # list of { peer_id = "...", multiaddr = "/ip4/…/tcp/…" }

# ── CC-21c discovery ─────────────────────────────────────────────────────────
# V-4: Hoodi published bootnode ENR list.
# Source: https://github.com/eth-clients/hoodi/blob/main/metadata/bootstrap_nodes.yaml
# Retrieval date: 2026-08-07
