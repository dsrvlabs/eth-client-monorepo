# Six-service topology (Architecture §6.2–§6.3, CC-04).
# Configuration via CC_<SERVICE>_<FIELD> env vars; config/*.toml is local-dev only.
#
# SEC-H1: CC host publishes bind 127.0.0.1 only (metrics). The gRPC bus
# 9001–9006 is not published to the host — peers stay on the compose network.
# EL host ports (8545/6060/30303) are out of this bind policy.

x-cc-env: &cc-env
  RUST_LOG: ${RUST_LOG:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-cc-runtime: &cc-runtime
  restart: unless-stopped
  stop_signal: SIGTERM
  stop_grace_period: 5s # matches CC-01/3's budget, not the 10s default
  networks: [cc]

x-hc: &hc
  interval: 5s
  timeout: 2s
  retries: 12
  start_period: 10s

services:
  chain:
    <<: *cc-runtime
    build:
      context: .
      args:
        SERVICE: cc-chain
        CC_GIT_SHA: ${CC_GIT_SHA:-unknown}
    environment:
      <<: *cc-env
      CC_CHAIN_GRPC_ADDR: 0.0.0.0:9001
      CC_CHAIN_METRICS_ADDR: 0.0.0.0:9101
      # P0-07: leftover URI-override gate. E3 is in-process (S1-A-06).
      CC_CHAIN_ENGINE_URI: http://engine:9004
      CC_CHAIN_EL_ENDPOINT: http://el:8551
      CC_CHAIN_JWT_SECRET_PATH: /jwt/jwt.hex
    volumes:
      - ./secrets:/jwt:ro
    ports: ["127.0.0.1:9101:9101"]
    healthcheck:
      <<: *hc
      # Aggregate "": after a core is installed this is probe_core_liveness, not process-up (ADR-R-04).
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:9001"]

  p2p:
    <<: *cc-runtime
    build:
      context: .
      args:
        SERVICE: cc-p2p
        CC_GIT_SHA: ${CC_GIT_SHA:-unknown}
    environment:
      <<: *cc-env
      CC_P2P_GRPC_ADDR: 0.0.0.0:9002
      CC_P2P_METRICS_ADDR: 0.0.0.0:9102
      CC_P2P_PEERS__CHAIN: http://chain:9001
      # P0-07: WatchServeWindow / serve path — TOML localhost fail-closes to NOT_SERVING.
      CC_P2P_PEERS__STORAGE: http://storage:9006
      # CC-4N / §1.7: persist node_key (CC-20b) + enr_seq (CC-4E) on the named volume.
      CC_P2P_NODE_KEY_PATH: /app/data/node_key
    volumes:
      - cc-p2p-identity:/app/data
    ports: ["127.0.0.1:9102:9102"]
    depends_on:
      chain:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:9002"]

  attestation:
    <<: *cc-runtime
    build:
      context: .
      args:
        SERVICE: cc-attestation
        CC_GIT_SHA: ${CC_GIT_SHA:-unknown}
    environment:
      <<: *cc-env
      CC_ATTESTATION_GRPC_ADDR: 0.0.0.0:9003
      CC_ATTESTATION_METRICS_ADDR: 0.0.0.0:9103
      CC_ATTESTATION_PEERS__CHAIN: http://chain:9001
    ports: ["127.0.0.1:9103:9103"]
    depends_on:
      chain:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:9003"]

  engine:
    <<: *cc-runtime
    build:
      context: .
      args:
        SERVICE: cc-engine
        CC_GIT_SHA: ${CC_GIT_SHA:-unknown}
    environment:
      <<: *cc-env
      CC_ENGINE_GRPC_ADDR: 0.0.0.0:9004
      CC_ENGINE_METRICS_ADDR: 0.0.0.0:9104
      CC_ENGINE_PEERS__CHAIN: http://chain:9001
      # P0-07 / CC-38a: EngineStream to p2p on `cc` (not a health peer).
      CC_ENGINE_P2P_URI: http://p2p:9002
      # Engine API auth (CC-30a/b, Architecture §7). Mount matches el's /jwt/jwt.hex
      # so `docker compose logs | grep -i crc32` shows the matching pair.
      CC_ENGINE_EL_ENDPOINT: http://el:8551
      CC_ENGINE_JWT_SECRET_PATH: /jwt/jwt.hex
    volumes:
      - ./secrets:/jwt:ro                 # same secret as el; never COPY'd into image
    ports: ["127.0.0.1:9104:9104"]
    depends_on:
      chain:
        condition: service_healthy
      # ADR P3-14: service_started, never service_healthy. EL health is
      # eth_syncing==false (minutes–hours); Phase A exercises the client while
      # the EL catches up, so the stack must not wait on a synced EL.
      el:
        condition: service_started
    healthcheck:
      <<: *hc
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:9004"]

  storage:
    <<: *cc-runtime
    build:
      context: .
      args:
        SERVICE: cc-storage
        CC_GIT_SHA: ${CC_GIT_SHA:-unknown}
    environment:
      <<: *cc-env
      CC_STORAGE_GRPC_ADDR: 0.0.0.0:9006
      CC_STORAGE_METRICS_ADDR: 0.0.0.0:9106
      CC_STORAGE_PEERS__CHAIN: http://chain:9001
      # P1-A/27 / ADR-P4-13: I-node-id against p2p's persisted key (same volume, :ro).
      CC_STORAGE_NODE_KEY_PATH: /identity/node_key
      # CC-4N / §1.7: redb datadir on the named volume (~59 GiB steady, 128 GiB provisioned).
      CC_STORAGE_DATA_DIR: /app/data
    volumes:
      - cc-store-data:/app/data
      - cc-p2p-identity:/identity:ro
    ports: ["127.0.0.1:9106:9106"]
    depends_on:
      chain:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:9006"]

  beacon-api:
    <<: *cc-runtime
    build:
      context: .
      args:
        SERVICE: cc-beacon-api
        CC_GIT_SHA: ${CC_GIT_SHA:-unknown}
    environment:
      <<: *cc-env
      CC_BEACON_API_GRPC_ADDR: 0.0.0.0:9005
      CC_BEACON_API_METRICS_ADDR: 0.0.0.0:9105
      CC_BEACON_API_PEERS__CHAIN: http://chain:9001
      CC_BEACON_API_PEERS__ATTESTATION: http://attestation:9003
      CC_BEACON_API_PEERS__STORAGE: http://storage:9006
    ports: ["127.0.0.1:9105:9105"]
    depends_on:
      chain:
        condition: service_healthy
      attestation:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      <<: *hc
      test: ["CMD", "/usr/local/bin/grpc-health-probe", "-addr=:9005"]

  # ── Phase 3 EL (CC-39a). Pinned exact tag; 8551 stays on the cc network only.
  # Inherits stop_grace_period: 5s from x-cc-runtime (CC service budget). geth may
  # still be force-killed mid-flush on large elstore; lengthen only if soak shows it.
  el:
    <<: *cc-runtime                       # restart: unless-stopped, SIGTERM, networks: [cc]
    image: ethereum/client-go:v1.17.5     # EXACT tag — never floating tags (both move under a stack).
                                          # Resolved digest recorded in docs/el-runbook.md (V-3).
    command:
      - --hoodi
      - --syncmode=snap
      - --datadir=/data
      # --- the Container-Auth Trap: both defaults break a container CL, differently ---
      - --authrpc.addr=0.0.0.0            # default "localhost" → CONNECTION REFUSED from another container
      - --authrpc.port=8551               # authenticated Engine API; NOT published to the host
      - --authrpc.vhosts=el               # default ["localhost"] → HTTP 403 "invalid host specified"
                                          #   (geth serves any IP Host; validates hostnames; engine→http://el:8551
                                          #   sends Host: el — not "engine". Use el or *.)
      - --authrpc.jwtsecret=/jwt/jwt.hex
      # --- unauthenticated eth namespace, for the healthcheck and for debugging ---
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3
      - --http.vhosts=*
      # --- geth's own newPayload timings, as an independent reference (CC-39/7, CC-3C /2) ---
      - --metrics
      - --metrics.addr=0.0.0.0
      - --metrics.port=6060
    volumes:
      - elstore:/data
      - ./secrets:/jwt:ro                 # NOT copied into any image (.dockerignore)
    # 8545 eth_syncing / operator; 6060 metrics; 30303 devp2p. 8551 is intentionally omitted.
    ports:
      - "8545:8545"
      - "6060:6060"
      - "30303:30303/tcp"
      - "30303:30303/udp"
    healthcheck:
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
      # eth_syncing == false, not "the port is open" (CC-39/8 / ADR P3-14). geth's own
      # binary over IPC — the alpine image has no curl; verified against v1.17.5 (§12/6).
      test: ["CMD-SHELL", "geth attach --exec 'eth.syncing == false' /data/geth.ipc | grep -q true"]

networks:
  cc: {}

volumes:
  elstore: {}
  # CC-4N / §1.7 — consensus durable surface. The two volumes are one backup unit
  # (docs/running.md): restore them together; a store beside a different node_key
  # is wrong-index columns and must refuse (I-node-id / ADR P4-13).
  cc-store-data:      # storage: the redb file, ~59 GiB steady, 128 GiB provisioned (§9)
  cc-p2p-identity:    # p2p: node_key (CC-20b) + enr_seq (CC-4E). storage mounts :ro at /identity.
