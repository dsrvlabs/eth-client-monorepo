# cargo-nextest profiles (CC-07a). CI uses `--profile ci`.
[profile.ci]
retries = 0
failure-output = "immediate-final"

# Wall-clock gates are load-sensitive. `num-cpus` reserves the full thread
# pool so nothing else runs in parallel (max-threads=1 alone only serializes
# within the group — other tests still contend for CPU).
[test-groups]
exclusive-perf-gates = { max-threads = "num-cpus" }

[[profile.ci.overrides]]
filter = 'test(cc1h_mid_gate_with_fork_choice_clone)'
test-group = 'exclusive-perf-gates'

[[profile.default.overrides]]
filter = 'test(cc1h_mid_gate_with_fork_choice_clone)'
test-group = 'exclusive-perf-gates'