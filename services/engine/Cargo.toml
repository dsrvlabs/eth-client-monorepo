[package]
name = "cc-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cc_engine"
path = "src/lib.rs"

[[bin]]
name = "cc-engine"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
alloy-primitives = { workspace = true }
cc-bootstrap = { workspace = true }
cc-config = { workspace = true }
cc-proto = { workspace = true }
# CC-32b: SSZ decode of ExecutionPayload (Mainnet) — DAG row appends cc-types.
cc-types = { workspace = true }
# CC-37b: CellKzg::compute_cells (DAG row appends cc-crypto — never re-sort).
cc-crypto = { workspace = true }
crc32fast = { workspace = true }
ethereum_ssz = { workspace = true }
futures = { workspace = true }
# CC-38a: session ids for EngineHello (Phase 2 §10.6 reconnect curve).
getrandom = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
prometheus-client = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# CC-37a: kzg_commitment_to_versioned_hash (kept; no longer the only hash path).
sha2 = { workspace = true }
ssz_types = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
tonic = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
tree_hash = { workspace = true }
wiremock = { workspace = true }
