syntax = "proto3";
package eth.engine.v1;

import "eth/common/v1/common.proto";

// Execution-layer bridge: Engine API client and payload validation.
//
// Phase 3 adds: NewPayload / ForkchoiceUpdated / GetEngineState surface toward
//   the EL, plus the payload-status feed consumed by chain fork choice.
// Phase 0 stubs EL validation as optimistic; Phase 3 makes the node a fully
//   verifying follower.
//
// Invariant (CC-3K /7, Architecture §1.2): consensus / execution containers
// cross as `bytes ssz` + scalars only — never remodelled as proto field trees
// (remodelling ExecutionPayload as proto fields is the single most natural wrong turn).
service EngineService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  // CC-32b: chain → engine newPayload bridge (ordered lane → engine_newPayloadV4).
  rpc NewPayload(NewPayloadRequest) returns (NewPayloadResponse);
  // CC-32b declares the RPC; the fcU driver that fills it is CC-33.
  rpc ForkchoiceUpdated(ForkchoiceUpdatedRequest) returns (ForkchoiceUpdatedResponse);
  // CC-32b declares the field set; el_offline maps 1:1 onto EngineState::Offline
  // (CC-3B / CC-36a). No Phase 3 caller — Phase 6 consumes for node/syncing.
  rpc GetEngineState(GetEngineStateRequest) returns (GetEngineStateResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  eth.common.v1.BuildInfo build_info = 1;
}

// Engine API `PayloadStatusV1` (CC-35a / Architecture §4.7).
//
// `latest_valid_hash` MUST be explicitly optional: absent and all-zeros are
// different answers (null → InvalidateOne; 0x00…00 → first non-Irrelevant
// ancestor). A bare `bytes` whose empty default conflates them is forbidden.
message PayloadStatusV1 {
  // VALID | INVALID | SYNCING | ACCEPTED | INVALID_BLOCK_HASH
  string status = 1;
  // Absent  ≜ JSON null (case 3). Present 32 zero bytes ≜ case 2 sentinel.
  // Present 32 non-zero bytes ≜ case 1 execution block hash.
  optional bytes latest_valid_hash = 2;
  optional string validation_error = 3;
}

// Spec-shaped NewPayloadRequest fields as SSZ + scalars (CC-32b).
//
// `ssz` is the SSZ encoding of `ExecutionPayload` (Mainnet preset hard-wired
// on the engine binary — Architecture ≠13/5). JSON/hex encoding to the EL
// happens exactly once inside services/engine.
message NewPayloadRequest {
  // ExecutionPayload, SSZ-encoded. Never remodelled as a proto message tree.
  bytes ssz = 1;
  // Versioned hashes derived from blob_kzg_commitments (32 B each).
  repeated bytes versioned_hashes = 2;
  // Parent beacon block root (32 B).
  bytes parent_beacon_block_root = 3;
  // Flattened execution requests: type || ssz_serialize(request_data),
  // ascending type order, empty lists omitted (get_execution_requests_list).
  repeated bytes execution_requests = 4;
}

message NewPayloadResponse {
  PayloadStatusV1 payload_status = 1;
}

// ForkchoiceStateV1 triple + chain sequence (CC-33 driver owns emission order).
// Payload attrs are omitted on the wire in Phase 3 (CC-31 /8) — not a field.
message ForkchoiceUpdatedRequest {
  bytes head_block_hash = 1;
  bytes safe_block_hash = 2;
  bytes finalized_block_hash = 3;
  // Monotonic sequence assigned by chain's fcU driver; engine drops stale.
  uint64 sequence = 4;
  // Chain process/session id. Engine resets the sequence high-water mark when
  // this changes (reconnect / chain restart — §3.8/2). Zero is treated as
  // "unspecified" and does not trigger a reset by itself.
  uint64 session_id = 5;
  // Head beacon slot for -38002 diagnostics (optional; 0 = unknown).
  uint64 head_slot = 6;
}

message ForkchoiceUpdatedResponse {
  PayloadStatusV1 payload_status = 1;
  // Always absent while attrs are null on the wire (Phase 3).
  optional bytes payload_id = 2;
}

message GetEngineStateRequest {}

// Surface Phase 6 consumes (CC-3B). el_offline maps 1:1 onto the external
// collapse of CC-36a's four-state machine:
//   Synced | Syncing  → Online  → el_offline = false
//   Offline | AuthFailed → Offline → el_offline = true
// Distinct from chain's is_optimistic (fork choice / payload validation).
message GetEngineStateResponse {
  // true when the EL transport is Offline or AuthFailed (beacon-APIs required).
  bool el_offline = 1;
  // synced | syncing | offline | auth_failed (Architecture §3.7 / §9.3).
  string internal_state = 2;
}
