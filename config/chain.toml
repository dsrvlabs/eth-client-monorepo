# Local-dev defaults for `chain` (Architecture §6.3).
# Compose overrides via CC_CHAIN_* environment variables.

grpc_addr = "127.0.0.1:9001"
metrics_addr = "127.0.0.1:9101"
log_format = "json"
log_filter = "info"

# CC-18b residency / body ring (Architecture §7.5).
max_resident_states = 4
body_ring_capacity = 64

# CC-18c / CC-44a event bus bounds (Architecture §4.3 / §7.3).
# Two bounds; the **byte ceiling binds first** (OQ-P1-2).
# 4096 events / 64 MiB → ~33–55 min resume window at cgc=8.
#
# CC-4D: shrinking event_ring_bytes below 64 MiB is a dangerous knob —
# refused at startup unless genesis_validators_root is neither Hoodi's nor
# mainnet's (devnet 1 MiB override lives in devnet/retention-compressed.toml).
event_ring_events = 4096
event_ring_bytes = 67108864
subscriber_queue_capacity = 256

# CC-19a checkpoint bootstrap. Empty providers → core stays absent
# (NOT_BOOTSTRAPPED) for local compose; set providers + network_config to
# bootstrap from a live finalized checkpoint.
checkpoint_providers = []
# Optional weak-subjectivity pin (SEC-19a-1). When unset, assertion 1 is
# skipped and the first self-consistent provider is trusted (warn-logged).
# Set for prod/mainnet soak from an out-of-band source.
# checkpoint_root = "0x…"
# Path to consensus-specs YAML for /eth/v1/config/spec cross-check (required
# when checkpoint_providers is non-empty). Example Hoodi fixture:
# network_config = "crates/types/tests/fixtures/hoodi-config.yaml"
#
# Hoodi provider list (ordered; enable for soak / live bootstrap):
# checkpoint_providers = [
#   "https://checkpoint-sync.hoodi.ethpandaops.io",
#   "https://hoodi.beaconstate.ethstaker.cc",
#   "https://hoodi.checkpoint.sigp.io",
#   "https://beaconstate-hoodi.chainsafe.io",
#   "https://hoodi.beaconstate.info",
#   "https://hoodi-checkpoint-sync.stakely.io",
#   "https://hoodi-checkpoint-sync.attestant.io",
# ]

# Spec-mandated SAFE_SLOTS_TO_IMPORT_OPTIMISTICALLY (sync/optimistic.md).
# Default 128. Kept for disaster recovery (fork-choice poisoning during a
# transition) rather than because a live path exercises the merge-transition
# gate on this latest-fork-only, checkpoint-sync-only client.
# Override: CC_CHAIN_SAFE_SLOTS_TO_IMPORT_OPTIMISTICALLY or the
# --safe-slots-to-import-optimistically flag equivalent.
# Loaded today; threaded into is_optimistic_candidate_block only when the
# optimistic-import gate lands (CC-3B family / import wiring).
safe_slots_to_import_optimistically = 128

# Leftover compose URI (S0-B-02 gate). E3 is in-process as of S1-A-06.
# Compose override: CC_CHAIN_ENGINE_URI=http://engine:9004
engine_uri = "http://127.0.0.1:9004"

# In-process Engine API (S1-A-06). Same knobs as config/engine.toml.
# Compose: CC_CHAIN_EL_ENDPOINT / CC_CHAIN_JWT_SECRET_PATH.
el_endpoint = "http://127.0.0.1:8551"
jwt_secret_path = "secrets/jwt.hex"
slot_duration_ms = 12000
attestation_due_bps = 3333

# MAXIMUM_GOSSIP_CLOCK_DISPARITY (ms). Applied at import so a block this far
# before its slot start is not IGNOREd as future_slot. Not quantized to a slot.
maximum_gossip_clock_disparity_ms = 500

# No health peers — chain is the root of the acyclic health DAG.
[peers]

[timeouts]
new_payload_ms = 8000
forkchoice_updated_ms = 8000
get_blobs_ms = 1000
exchange_capabilities_ms = 1000
eth_syncing_ms = 1000
multiplier = 1.0

[el_forks]
osaka_time = 1761677592
bpo1_time = 1762365720
bpo2_time = 1762955544
