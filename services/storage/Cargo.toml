[package]
name = "cc-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cc_storage"
path = "src/lib.rs"

[[bin]]
name = "cc-storage"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
cc-bootstrap = { workspace = true }
cc-config = { workspace = true }
cc-proto = { workspace = true }
cc-state-transition = { workspace = true }
cc-store = { workspace = true }
# S2-B-01: writer.rs + serve.rs live in cc-storage-core (compiled via #[path]).
cc-storage-core = { workspace = true }
cc-types = { workspace = true }
ethereum_ssz = { workspace = true }
futures = { workspace = true }
prometheus-client = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true }
# CC-4H post-pass invariant logging via MetricsInvariantSink.
tracing = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# CC-4G four-effects model: node_id → get_custody_groups.
alloy-primitives = { workspace = true }
