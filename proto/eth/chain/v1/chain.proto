syntax = "proto3";
package eth.chain.v1;

import "eth/common/v1/common.proto";
import "eth/p2p/v1/p2p.proto";

// The hot core: state transition, fork choice, BeaconState.
//
// Phase 1 (CC-18) adds: ImportBlock, GetHead, SubscribeEvents (server-streaming, with the
//   resume-cursor semantics from the re-plan).
// Phase 1 (CC-1E) adds: batched on_attestation weight updates.
// Phase 1 (CC-1F) adds: unary shuffling + pubkey queries.
// Phase 2 (CC-27) adds: the bidirectional p2p stream (blocks/columns down, verdicts up)
//   and GetValidatorRecords (§5.4a / §16/5).
// Phase 3 (CC-3B) adds: IsOptimistic — fork-choice optimistic surface for Phase 6
//   (`is_optimistic` / known tri-state; no Phase 3 caller).
service ChainService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc ImportBlock(ImportBlockRequest) returns (ImportBlockResponse);
  rpc GetHead(GetHeadRequest) returns (GetHeadResponse);
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream Event);
  // Batched on_attestation weight updates (CC-1E).
  // Signatures / committee membership are NOT verified here (SEC-1E-1 residual).
  // Trusted internal RPC until Phase 5 is the sole producer and validates BLS
  // against cached shufflings — do not expose to untrusted networks without authz.
  // Bound: 128 attestations per batch; over that is INVALID_ARGUMENT (never truncated).
  rpc ApplyAttestations(ApplyAttestationsRequest) returns (ApplyAttestationsResponse);
  // CC-1F: packed epoch shuffling from the head state's cache (current + next
  // epoch only). Other epochs → FAILED_PRECONDITION. Response carries
  // dependent_root so callers cache by decision root (§5.4).
  rpc GetCommitteeShuffling(GetCommitteeShufflingRequest) returns (GetCommitteeShufflingResponse);
  // CC-1F: registry pubkeys by index range or explicit index list. Bounded at
  // 256 indices per request; over that is INVALID_ARGUMENT (never truncation).
  rpc GetValidatorPubkeys(GetValidatorPubkeysRequest) returns (GetValidatorPubkeysResponse);
  // CC-27: bidirectional p2p stream. Message types live in eth.p2p.v1 (§10.1–10.2).
  // p2p dials chain; chain is the server (health DAG / ADR-07).
  rpc P2pStream(stream eth.p2p.v1.P2pToChain) returns (stream eth.p2p.v1.ChainToP2p);
  // CC-27a / §5.4a: SSZ Validator records by index for operation-topic gossip
  // checks. Bound 256; over → INVALID_ARGUMENT, never truncated.
  rpc GetValidatorRecords(GetValidatorRecordsRequest) returns (GetValidatorRecordsResponse);
  // CC-3B: optimistic status from fork choice (no Phase 3 caller — Phase 6
  // consumes for GET /eth/v1/node/syncing and block/state optimistic envelopes).
  // Root-less = node-level is_optimistic (CC-34c both branches); root present =
  // per-root derivation from ProtoNode.execution_status. known=false when the
  // root is absent from the proto-array (Phase 6 must not invent false).
  rpc IsOptimistic(IsOptimisticRequest) returns (IsOptimisticResponse);
  // CC-44a /3: canonical roots for a contiguous slot range above finalized
  // retention. Used by storage on CURSOR_TOO_OLD gap fill (§4.6 step 2).
  // Additive unary on the existing ChainService (not a tenth contract).
  rpc GetCanonicalRoots(GetCanonicalRootsRequest) returns (GetCanonicalRootsResponse);
  // CC-45b / §3.5 / Deviations 6 / ADR P4-07: storage → chain restore push.
  //
  // **Why storage pushes and chain cannot pull (depends_on / health):** the
  // compose health DAG forbids the reverse. `storage`'s compose entry is
  // `depends_on: chain: service_healthy` and its health peer is `chain`, so
  // `chain` cannot be a client of `storage` without a dependency cycle.
  // Restart therefore has to be *pushed* by the side that holds the data
  // (storage). This rides the existing storage→chain edge — one additive RPC
  // beyond the PRD's list, contract count stays at nine.
  //
  // Privileged import path (same trust class as ApplyAttestations above):
  // signatures are not re-verified (BlockSignatureStrategy::NoVerification;
  // verified at first import; CC-45 /5); the DA gate is not re-run (per-block
  // status comes from da_status and is applied as a verdict; CC-45 /4).
  rpc RestoreFromStore(stream RestoreChunk) returns (RestoreResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  eth.common.v1.BuildInfo build_info = 1;
}

// Parent-plan shape, verbatim (re-plan §Contracts / CC-18a):
//   bytes ssz + uint32 fork + bytes root + eth.common.v1.Source source.
// Consensus body crosses as SSZ bytes only — never re-modelled as a proto message.
message ImportBlockRequest {
  bytes ssz = 1; // SignedBeaconBlock, SSZ-encoded
  uint32 fork = 2; // fork version tag
  bytes root = 3; // pre-computed hash_tree_root (dedup probe only; server recomputes on miss)
  eth.common.v1.Source source = 4; // GOSSIP | REQRESP | API
}

// Import outcome. UNKNOWN_PARENT is a first-class verdict (not an error) so the driver
// walk-back can count and act on it (CC-1A/1, Architecture §7.2).
enum ImportBlockVerdict {
  IMPORT_BLOCK_VERDICT_UNSPECIFIED = 0;
  IMPORT_BLOCK_VERDICT_IMPORTED = 1;
  IMPORT_BLOCK_VERDICT_DUPLICATE = 2;
  IMPORT_BLOCK_VERDICT_DEFERRED_DA = 3;
  IMPORT_BLOCK_VERDICT_UNKNOWN_PARENT = 4;
  IMPORT_BLOCK_VERDICT_INVALID = 5;
}

message ImportBlockResponse {
  ImportBlockVerdict verdict = 1;
  string reason = 2; // human-readable; empty on success paths
}

message GetHeadRequest {}

// Checkpoint pair for justified / finalized (epoch + root). This is the fork-choice
// checkpoint identity used by GetHead — not a re-model of a consensus body (blocks still
// cross as bytes ssz).
message Checkpoint {
  uint64 epoch = 1;
  bytes root = 2;
}

message GetHeadResponse {
  bytes head_root = 1;
  uint64 head_slot = 2;
  Checkpoint justified = 3;
  Checkpoint finalized = 4;
}

// Resume cursor for SubscribeEvents (Architecture §7.3).
// seq is authoritative; slot/root are validated against the ring entry and carry identity
// for idempotent consumers. session_id is a per-process random u64 so a cursor from a
// previous incarnation cannot silently match after a restart (ADR-P1-11).
message Cursor {
  uint64 session_id = 1;
  uint64 seq = 2;
  uint64 slot = 3;
  bytes root = 4;
}

// Empty cursor (unset) means "start live from the current tip, no replay".
// A set cursor means "replay from seq+1, then live".
message SubscribeEventsRequest {
  Cursor cursor = 1;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_HEAD = 1;
  EVENT_KIND_CHAIN_REORG = 2;
  EVENT_KIND_FINALIZED_CHECKPOINT = 3;
  EVENT_KIND_BLOCK_IMPORTED = 4;
  // CC-44a / Architecture §4.2: DataColumnSidecar SSZ relay (opaque to chain).
  EVENT_KIND_DATA_COLUMN = 5;
}

// Consumers must be idempotent; root carries the identity (re-plan §Contracts).
// payload is kind-specific per Architecture §4.2; opaque to the bus.
message Event {
  uint64 seq = 1;
  uint64 slot = 2;
  bytes root = 3;
  EventKind kind = 4;
  bytes payload = 5; // kind-specific; opaque to the bus
}

// ---------------------------------------------------------------------------
// ApplyAttestations (CC-1E)
// ---------------------------------------------------------------------------

// Bound for ApplyAttestationsRequest.attestations_ssz. Over this → INVALID_ARGUMENT
// with no partial application. Documented here for consumers; the numeric check
// is enforced by the handler (proto has no max_items on repeated bytes).
// MAX_APPLY_ATTESTATIONS = 128

// Batched free-floating attestations for fork-choice vote trackers.
//
// Each entry is SSZ-encoded IndexedAttestation (indices already resolved). Phase 1
// does **not** verify BLS signatures, committee membership, or structural
// indexed-attestation rules at the store level (§6.6 / SEC-1E-1 residual).
// This is a privileged weight-injection surface: **trusted internal callers only**
// until Phase 5 verifies in the attestation service and is the sole live feed.
// The handler is a loop of on_attestation with **no per-attestation head
// computation**; weights are only correct after get_head (observed through GetHead).
message ApplyAttestationsRequest {
  // SSZ-encoded IndexedAttestation values. Max 128; over → INVALID_ARGUMENT.
  repeated bytes attestations_ssz = 1;
}

// Per-attestation outcome so a Phase 5 producer can distinguish applied from
// rejected without a second round trip.
enum AttestationApplyVerdict {
  ATTESTATION_APPLY_VERDICT_UNSPECIFIED = 0;
  ATTESTATION_APPLY_VERDICT_APPLIED = 1;
  ATTESTATION_APPLY_VERDICT_REJECTED = 2;
}

message AttestationApplyResult {
  AttestationApplyVerdict verdict = 1;
  string reason = 2; // empty on APPLIED; short explanation on REJECTED
}

message ApplyAttestationsResponse {
  // One result per request entry, in the same order.
  repeated AttestationApplyResult results = 1;
}

// ── CC-1F: GetCommitteeShuffling ─────────────────────────────────────────────
//
// Served for the head state's **current and next epoch** only (Architecture
// §7.7 / §16/6). The packed assignment is the shuffled active-validator list
// for the epoch — the same layout `get_beacon_committee` slices. Callers must
// cache by `dependent_root` (block root at start_slot(epoch) − 1), not epoch
// alone: two branches in the same epoch with different decision roots must not
// share a shuffling (§5.4).

message GetCommitteeShufflingRequest {
  // Target epoch. Must be head current or current+1; otherwise FAILED_PRECONDITION.
  uint64 epoch = 1;
}

message GetCommitteeShufflingResponse {
  // Active validators in shuffled order for `epoch` (packed committee assignment).
  // Committees are contiguous slices of this list.
  repeated uint64 shuffled_indices = 1;
  // Decision root: block root at start_slot(epoch) − 1. Cache key for the caller.
  bytes dependent_root = 2;
  // Echo of the served epoch (same as the request when accepted).
  uint64 epoch = 3;
  // Committees per slot for the epoch so the caller can slice without a second query.
  uint64 committees_per_slot = 4;
}

// ── CC-1F: GetValidatorPubkeys ───────────────────────────────────────────────
//
// Registry read through the head state's validator list / PubkeyIndexMap.
// Request either a contiguous range (`start_index` + `count`) **or** an explicit
// `indices` list. If `indices` is non-empty it takes precedence over the range.
// Bound: at most **256** indices per request; over that is INVALID_ARGUMENT.
// An empty/zero-count request (no indices, count == 0) is also INVALID_ARGUMENT.

message GetValidatorPubkeysRequest {
  // Start of a contiguous range (used when `indices` is empty).
  uint64 start_index = 1;
  // Length of the contiguous range (used when `indices` is empty).
  uint64 count = 2;
  // Explicit index list; when non-empty, overrides start_index/count.
  repeated uint64 indices = 3;
}

message GetValidatorPubkeysResponse {
  // Validator indices (same order as requested).
  repeated uint64 indices = 1;
  // 48-byte BLS public keys, parallel to `indices`.
  repeated bytes pubkeys = 2;
}

// ── CC-27a / §5.4a: GetValidatorRecords ──────────────────────────────────────
//
// Head-state registry read of full SSZ `Validator` containers (not pubkeys).
// Bound: at most **256** indices; over that is INVALID_ARGUMENT (never truncation).
// Empty request is INVALID_ARGUMENT. Response carries the slot the records were
// read at so callers can cache with a one-epoch TTL (Architecture §5.4a).

message GetValidatorRecordsRequest {
  // Explicit index list. Max 256; over → INVALID_ARGUMENT.
  repeated uint64 indices = 1;
}

message GetValidatorRecordsResponse {
  // SSZ-encoded Validator containers, parallel to the request indices.
  repeated bytes ssz = 1;
  // Head slot at which the records were read.
  uint64 slot = 2;
}

// ── CC-3B: IsOptimistic ──────────────────────────────────────────────────────
//
// Tri-state surface for Phase 6 (`GET /eth/v1/node/syncing`.is_optimistic and
// the optimistic envelope on block/state endpoints). Answers come from fork
// choice (`ProtoNode.execution_status` / `is_optimistic_node`), never from
// engine liveness — a node can be `el_offline: false, is_optimistic: true`
// when the EL is up and answering SYNCING.
//
// `known: false` means the root is not in the store; callers MUST ignore
// `is_optimistic` in that case (a bare bool would make Phase 6 report
// `is_optimistic: false` for a block the node has never seen).

message IsOptimisticRequest {
  // Absent / empty → node-level predicate (CC-34c both branches).
  // Present 32-byte root → per-root `is_optimistic` derivation.
  optional bytes root = 1;
}

message IsOptimisticResponse {
  // When known=true: whether the root (or node head) is optimistically imported.
  // When known=false: undefined — ignore.
  bool is_optimistic = 1;
  // false ≜ root not in the proto-array (unknown to this node).
  bool known = 2;
}

// ── CC-44a /3: GetCanonicalRoots ─────────────────────────────────────────────
//
// Contiguous slot → canonical root lookup for a gap bounded by an operator
// restart (§4.6). Answers only above chain's finalized retention (finalized
// checkpoint epoch start). Below that → FAILED_PRECONDITION /
// BELOW_FINALIZED_RETENTION. One root per slot in the inclusive range
// [start_slot, end_slot]; empty slots carry the latest block root at or before
// that slot on the head's parent chain.

message GetCanonicalRootsRequest {
  // Inclusive lower bound (slot).
  uint64 start_slot = 1;
  // Inclusive upper bound (slot). Must be >= start_slot.
  uint64 end_slot = 2;
}

message GetCanonicalRootsResponse {
  // One 32-byte root per slot in [start_slot, end_slot], inclusive, in order.
  repeated bytes roots = 1;
}

// ── CC-45b / §3.5: RestoreFromStore ──────────────────────────────────────────
//
// Client-streaming: storage pushes the snapshot BeaconState, the replay set
// (snapshot_slot+1 .. last stored slot, including non-canonical siblings), and
// ForkChoiceScalars. Chain rebuilds fork choice and replies with the resulting
// head plus `matched_expected`.
//
// Stream order for a non-empty store:
//   1. header
//   2. zero or more state_ssz_chunk (concatenated = snapshot BeaconState SSZ)
//   3. zero or more block (ascending slot, siblings included)
//   4. footer { expected_head_root, expected_head_slot }
//
// Empty store (first-ever start): a single chunk with `empty` set. Chain
// collapses the AwaitingRestore grace period immediately and falls back to
// checkpoint sync (CC-19 demoted to fallback).

// Wire DA status carried on each restore block (mirrors store `DaStatus`).
// Applied as a verdict on the restore path — the DA gate is **not** re-run.
enum RestoreDaStatus {
  RESTORE_DA_STATUS_UNSPECIFIED = 0;
  // Block stored Available: restored without re-gating (gate invocations = 0).
  RESTORE_DA_STATUS_AVAILABLE = 1;
  // Block stored Deferred: restored **as deferred** (never silently promoted).
  RESTORE_DA_STATUS_DEFERRED = 2;
}

// One client-stream frame.
message RestoreChunk {
  oneof body {
    // First-ever / empty store: collapses AwaitingRestore grace immediately.
    RestoreEmpty empty = 1;
    // Stream header (once, first non-empty frame).
    RestoreHeader header = 2;
    // Snapshot BeaconState SSZ fragment (concatenated in order).
    bytes state_ssz_chunk = 3;
    // One block of the replay set (ascending slot; non-canonical siblings ok).
    RestoreBlock block = 4;
    // Terminal frame with the expected head after replay.
    RestoreFooter footer = 5;
  }
}

// Empty-store signal — no further frames expected.
message RestoreEmpty {}

// Header for a snapshot restore. `fork_choice_scalars_ssz` is the ~300-byte
// SSZ `ForkChoiceScalars` record (ADR P4-06) — **not** a 75 MB vote table.
//
// Two expiry triggers for the no-vote-table design (ADR P4-06) — both named so
// this is not rediscovered:
//
// Trigger A: block-embedded attestations are wired into
// on_attestation(..., is_from_block = true) — a spec-conformance gap Phase 4
// does not close. Consequence: probably none for the steady state
// (attestations sit inside the replayed blocks, so votes stay a function of
// the replay set). One unproven caveat: a validator whose latest attestation
// predates the snapshot loses that message; the head-stability argument is
// empirical (CC-45 /7), not proven here.
//
// Trigger B: Phase 5's attestation service becomes a live ApplyAttestations
// producer. Consequence: the record must grow a vote table or a bounded delta
// log — those free-floating attestations exist nowhere on disk, so nothing
// reconstructs them. Phase 5 entry condition, not a Phase 4 gap.
message RestoreHeader {
  // Store schema version (must match chain's expected Phase-4 schema).
  uint32 schema_version = 1;
  // 32-byte config digest (CC-40).
  bytes config_digest = 2;
  // SSZ `AnchorInfo` (opaque to chain; carried for diagnostics / pairing).
  bytes anchor_ssz = 3;
  // SSZ `Split` (hot/cold boundary at the snapshot).
  bytes split_ssz = 4;
  // SSZ `ForkChoiceScalars` (~300 B / fixed 240 B layout; ADR P4-06).
  // Includes `proposer_boost_root` — load-bearing across restart (CC-45 /3).
  bytes fork_choice_scalars_ssz = 5;
  // Slot of the snapshot BeaconState.
  uint64 snapshot_slot = 6;
  // Total byte length of the concatenated state SSZ (for progress / bounds).
  uint64 state_ssz_total_bytes = 7;
  // SSZ of the signed block that anchors the snapshot state (message used to
  // seed `get_forkchoice_store`). Empty when the state alone is sufficient
  // and the anchor block is reconstructed from `latest_block_header`.
  bytes anchor_block_ssz = 8;
  // Fork version tag for `anchor_block_ssz` decoding.
  uint32 anchor_block_fork = 9;
}

// One block in the ascending replay set.
message RestoreBlock {
  // SignedBeaconBlock SSZ.
  bytes ssz = 1;
  // Fork version tag.
  uint32 fork = 2;
  // Pre-computed hash_tree_root (32 B).
  bytes root = 3;
  // Stored DA verdict — applied, not re-gated (CC-45 /4).
  RestoreDaStatus da_status = 4;
}

// Terminal frame: the head storage expects after chain's replay.
message RestoreFooter {
  // Expected head root (32 B).
  bytes expected_head_root = 1;
  // Expected head slot.
  uint64 expected_head_slot = 2;
}

// Chain's reply after applying the restore stream.
//
// `matched_expected == false` is **fatal on the storage side**: both roots are
// logged and `cc_storage_replay_divergence_total` is incremented (CC-45 /3
// divergence guard; §3.5).
message RestoreResponse {
  // Head root after restore (32 B).
  bytes head_root = 1;
  // Head slot after restore.
  uint64 head_slot = 2;
  // True when (head_root, head_slot) equals the footer's expected pair.
  bool matched_expected = 3;
}
