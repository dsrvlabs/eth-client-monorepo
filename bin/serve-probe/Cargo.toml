[package]
name = "cc-serve-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cc-serve-probe"
path = "src/main.rs"

[lib]
name = "cc_serve_probe"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Allowed workspace edge ceiling (Phase 4 store DAG / check-crate-dag.sh):
# {cc-libp2p, cc-types, cc-config}. Must not depend on services/* paths.
cc-libp2p = { workspace = true }
cc-types = { workspace = true }
cc-config = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
