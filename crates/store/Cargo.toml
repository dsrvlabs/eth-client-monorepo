[package]
name = "cc-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Permanent DAG rule: cc-types only among workspace crates (Phase 4 / Architecture §1.1).
cc-types = { workspace = true }
# Engine body (CC-40b). Named only under crates/store/src/engine/ (CC-40/3).
redb = { workspace = true }
thiserror = { workspace = true }
# Meta SSZ records + config digest payload (CC-40a / §2.5).
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
ssz_types = { workspace = true }
typenum = { workspace = true }
sha2 = { workspace = true }
# Serve-window YAML field extract (CC-4A): MIN_VALIDATOR_WITHDRAWABILITY_DELAY,
# CHURN_LIMIT_QUOTIENT, optional vestigial MIN_EPOCHS_FOR_BLOCK_REQUESTS.
serde = { workspace = true }
serde_yaml = { workspace = true }
# Post-pass invariant logging (CC-4H); no workspace crate edge.
tracing = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Integration tests only: full SSZ decode of a real Hoodi block to assert
# PARENT_ROOT_SSZ_OFFSET (production code never names the container type).
# `cc-types` is already a normal dep; re-listed so `tests/*.rs` can name containers.
cc-types = { workspace = true }
ethereum_ssz = { workspace = true }
