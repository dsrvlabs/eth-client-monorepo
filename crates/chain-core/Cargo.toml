[package]
name = "cc-chain-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# S0-A-31 / R-13(b) only. Never default; declared so restore.rs cfg is known
# when that file is `#[path]`-compiled here. Never on the production binary.
s0-a-31-observe = []

[dependencies]
# S2-A-01: sources live here; `cc-chain` compiles them via `#[path]`.
# No HTTP client. No JWT signer ([ARCH] §6.2 / S2-A-01).

[dev-dependencies]
# Unit tests compile the moved files against unmoved siblings via `#[path]`.
arc-swap = { workspace = true }
bytes = { workspace = true }
cc-bootstrap = { workspace = true }
cc-crypto = { workspace = true, features = ["signing"] }
cc-fork-choice = { workspace = true }
cc-proto = { workspace = true }
cc-scheduler = { workspace = true }
cc-state-transition = { workspace = true }
cc-types = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
prometheus-client = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ssz_types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tree_hash = { workspace = true }
