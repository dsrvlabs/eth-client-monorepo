[package]
name = "cc-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# CHOSEN_DEFAULT (CC-11d): must match `KzgBackendKind::default()` and docs/kzg-benchmark.md.
default = ["kzg-c-kzg"]
# Architecture §4.3 — both may be on simultaneously; CI enables both for the vector job.
kzg-c-kzg = ["dep:c-kzg"]
kzg-rust-eth-kzg = ["dep:rust_eth_kzg"]

[dependencies]
blst = { workspace = true }
cc-types = { workspace = true }
ethereum_hashing = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
tree_hash = { workspace = true }
tree_hash_derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
c-kzg = { workspace = true, optional = true }
rust_eth_kzg = { workspace = true, optional = true }

[dev-dependencies]
sha2 = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "kzg"
harness = false
