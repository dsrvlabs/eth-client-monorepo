# CC-03/1 — buf workspace root (Architecture §3.3).
# No buf.lock (no BSR deps in Phase 0). No buf.gen.yaml (codegen is build.rs).
# CC-18a: third_party holds vendored google/rpc protos (ADR-P1-14) — excluded from
# lint/breaking; they are not our contract surface.
# RPC_RESPONSE_STANDARD_NAME is ignored only for chain.proto so the event bus
# message can stay `Event` (Architecture §7.3 / re-plan §Contracts), not
# `SubscribeEventsResponse`. CC-27a also streams eth.p2p.v1.P2pToChain /
# ChainToP2p (Architecture §10.2) — those names are intentional, not
# P2pStreamRequest/Response.
version: v2
modules:
  - path: .
lint:
  use:
    - DEFAULT
  ignore:
    - third_party
  ignore_only:
    RPC_RESPONSE_STANDARD_NAME:
      - eth/chain/v1/chain.proto
      # EngineStream uses EngineToP2p / P2pToEngine (Architecture §5.2), not
      # EngineStreamRequest/Response — same house style as P2pStream.
      - eth/p2p/v1/p2p.proto
      # CC-4F / Architecture §1.6: shared GetBlocksResponse / GetColumnsResponse
      # for ByRange+ByRoot, and stream payload types ServeWindow / StateChunk
      # (not WatchServeWindowResponse / GetSnapshotStateResponse).
      - eth/storage/v1/storage.proto
    RPC_REQUEST_STANDARD_NAME:
      - eth/chain/v1/chain.proto
      - eth/p2p/v1/p2p.proto
    # Shared ByRange/ByRoot response types (Architecture §1.6).
    RPC_REQUEST_RESPONSE_UNIQUE:
      - eth/storage/v1/storage.proto
breaking:
  use:
    - FILE
  ignore:
    - third_party
