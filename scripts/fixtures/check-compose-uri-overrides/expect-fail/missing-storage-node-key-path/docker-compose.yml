# Negative: identity volume is mounted but CC_STORAGE_NODE_KEY_PATH is absent.
services:
  chain:
    environment:
      CC_CHAIN_ENGINE_URI: http://engine:9004
  engine:
    environment:
      CC_ENGINE_P2P_URI: http://p2p:9002
  p2p:
    environment:
      CC_P2P_PEERS__STORAGE: http://storage:9006
  storage:
    environment:
      CC_STORAGE_DATA_DIR: /app/data
    volumes:
      - cc-store-data:/app/data
      - cc-p2p-identity:/identity:ro
