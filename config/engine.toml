# Local-dev defaults for `engine` (Architecture §6.3).
# Compose overrides via CC_ENGINE_* environment variables.

grpc_addr = "127.0.0.1:9004"
metrics_addr = "127.0.0.1:9104"
log_format = "json"
log_filter = "info"

# ── CC-38a ninth contract (Architecture §5.2, ADR P3-02) ────────────────────
# Plain root-level URI for EngineStream — not a health peer. p2p restarting
# must not make engine NOT_SERVING (the fast path is an accelerator).
p2p_uri = "http://127.0.0.1:9002"

# Consensus-specs YAML for the getBlobs blob-count gate (S0-A-07 / S1-B-02).
# Supplies blob_schedule + max_blobs_per_block_electra. A missing path is a
# startup error — production must not fall back to a compiled test fixture.
# Override: CC_ENGINE_NETWORK_CONFIG=...
network_config = "crates/types/tests/fixtures/hoodi-config.yaml"

# ── CC-30a Engine API transport (Architecture §3.6, §7) ─────────────────────
# Root-level keys (must appear *before* any [table] that would capture them).
# Authenticated JSON-RPC endpoint (compose: http://el:8551).
el_endpoint = "http://127.0.0.1:8551"
# Hex-encoded 32-byte JWT secret (optional 0x prefix). Override:
#   CC_ENGINE_JWT_SECRET_PATH
jwt_secret_path = "secrets/jwt.hex"

# Soft-deadline inputs (Architecture §3.6 / delta 12).
# soft_deadline_ms = ATTESTATION_DUE_BPS × SLOT_DURATION_MS / 10000
# Never configure the soft deadline as a timeout; never use SECONDS_PER_SLOT.
slot_duration_ms = 12000
attestation_due_bps = 3333

[peers]
chain = "http://127.0.0.1:9001"

# Five transport timeouts (spec) + operator multiplier (scales these five only).
[timeouts]
new_payload_ms = 8000
forkchoice_updated_ms = 8000
get_blobs_ms = 1000
exchange_capabilities_ms = 1000
eth_syncing_ms = 1000
multiplier = 1.0

# ── CC-31 EL fork schedule (Architecture §3.4, §12/7) ───────────────────────
# Hoodi EL fork activation times (unix seconds). Loaded config — never compiled
# into the binary (a fork schedule in a binary needs a release to correct).
#
# Source: ethereum/execution-apis + Hoodi network params (OsakaTime / BPO schedule).
# Retrieval date: 2026-08-07
#
# AmsterdamTime is unset on Hoodi today; when set, the version gate fails loud
# pre-flight for timestamps ≥ amsterdam_time (engine_newPayloadV5 is Phase 7+).
[el_forks]
osaka_time = 1761677592
bpo1_time = 1762365720
bpo2_time = 1762955544
# amsterdam_time = <unset>
