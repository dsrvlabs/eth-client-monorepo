# Static anchor for CC-19 checkpoint bootstrap on the self-devnet (CC-2Jd).
# Serves generated artifacts from /usr/share/nginx/html (mounted from devnet/out/anchor).
#
# Paths exercised by smoke / CC-19:
#   GET /eth/v1/beacon/genesis              → genesis.json
#   GET /eth/v1/config/spec                 → spec.json
#   GET /eth/v2/debug/beacon/states/genesis → genesis.ssz  (SSZ body)
#   GET /eth/v2/debug/beacon/states/finalized → genesis.ssz
#   GET /eth/v2/beacon/blocks/finalized     → (optional stub)
#   GET /genesis.ssz                        → raw genesis.ssz (convenience)

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout combined;
    sendfile      on;
    keepalive_timeout 15;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # JSON convenience endpoints
        location = /eth/v1/beacon/genesis {
            default_type application/json;
            try_files /genesis.json =404;
        }

        location = /eth/v1/config/spec {
            default_type application/json;
            try_files /spec.json =404;
        }

        # SSZ state fetch (CC-19 path)
        location = /eth/v2/debug/beacon/states/genesis {
            default_type application/octet-stream;
            add_header Eth-Consensus-Version fulu always;
            try_files /genesis.ssz =404;
        }

        location = /eth/v2/debug/beacon/states/finalized {
            default_type application/octet-stream;
            add_header Eth-Consensus-Version fulu always;
            try_files /genesis.ssz =404;
        }

        # Raw genesis.ssz (issue AC: curl genesis.ssz)
        location = /genesis.ssz {
            default_type application/octet-stream;
            add_header Eth-Consensus-Version fulu always;
            try_files /genesis.ssz =404;
        }

        location = /healthz {
            default_type text/plain;
            return 200 'ok\n';
        }
    }
}
