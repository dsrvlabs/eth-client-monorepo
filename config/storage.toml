# Local-dev defaults for `storage` (Architecture §6.3).
# Compose overrides via CC_STORAGE_* environment variables.
#
# Profile note (CC-4H / Architecture §2.7): multi-file profiles are not yet
# split. This file is the **devnet / local-dev** default surface:
#   check_invariants = true
# For the **Hoodi soak**, set `CC_STORAGE_CHECK_INVARIANTS=false` (or a future
# hoodi profile) so O(canonical-index) I-contig walks do not perturb disk
# measurements. Defaults are per-profile, not hard-coded in `cc-store`.

grpc_addr = "127.0.0.1:9006"
metrics_addr = "127.0.0.1:9106"
log_format = "json"
log_filter = "info"

# CC-40b durability knob (Architecture §8.4 / ADR P4-05).
# immediate = 1PC+C (default); paranoid = Immediate + two-phase commit.
# Override: CC_STORAGE_DURABILITY=paranoid (figment env layer in cc-config).
durability = "immediate"

# On-disk store directory (CC-44b write path). Compose binds a volume here.
# Override: CC_STORAGE_DATA_DIR=/data/storage
data_dir = "data/storage"

# CC-4H / §2.7: run store invariants at open (fatal) and after migration/prune
# (log + count). Devnet default **true**; Hoodi soak **false** (see profile note).
# Override: CC_STORAGE_CHECK_INVARIANTS=false
check_invariants = true

# ── CC-44b write-behind commit unit (Architecture §4.4) ──────────────────────
# One commit per slot. A crash loses everything after the last durable commit, so
# this value IS the loss bound: at 1 slot, a SIGKILL costs at most one slot of
# blocks and columns, which the next gap detection refetches. Batching an epoch
# would make the bound 32 slots and would save ~31 fsyncs per 6.4 minutes.
commit_slots = 1
# Flush when this many events accumulate without a slot boundary (default 64).
commit_max_events = 64
# Flush after this many milliseconds without a flush (default 4000 = 4 s).
commit_max_latency_ms = 4000

# ── CC-41 hot/cold migration (Architecture §3.2) ─────────────────────────────
# FINALIZED_CHECKPOINT advances the split every N epochs (Lighthouse
# `--epochs-per-migration` default **1**). One batch moves one cadence of
# canonical hot rows into cold and deletes unfinalized siblings (step 2).
# Override: CC_STORAGE_EPOCHS_PER_MIGRATION=4
epochs_per_migration = 1

# ── CC-42 snapshot ring + storage own replay (Architecture §3.3–3.6) ──────────
# Cadence 32 epochs (Grandine DEFAULT_ARCHIVAL_EPOCH_INTERVAL). If term (c)
# (SSZ deserialize + tree-hash-cache rebuild) measures > 5.0 s, this drops to
# 16 in the same commit (CC-42 /3 conditional). Steady disk is ring-bound.
# Override: CC_STORAGE_SNAPSHOT_EPOCHS=16
snapshot_epochs = 32
# Ring depth 4 — ~0.70 GB resident, cadence-independent (ADR P4-14 uncompressed).
# Override: CC_STORAGE_SNAPSHOT_RING=4
snapshot_ring = 4

# ── CC-44b single-writer channel bounds (Architecture §1.5) ──────────────────
# P0 write-behind → writer: 32 slots' commit units; on full **block** (never drop).
writer_p0_bound = 32
# P1 meta → writer: 64; on full **block**.
writer_p1_bound = 64
# P2 background → writer: 256 chunks; on full **drop newest** + count.
writer_p2_bound = 256

# ── CC-4F serve path (Architecture §7.2 / Deviations 4) ───────────────────────
# Per-response materialise buffer. 64 MiB × serve_permits(4) = 256 MiB ceiling.
# Override: CC_STORAGE_SERVE_BUFFER_BYTES=33554432
serve_buffer_bytes = 67108864
# Admission semaphore permits (default 4).
# Override: CC_STORAGE_SERVE_PERMITS=2
serve_permits = 4
# Max wait for a permit before RESOURCE_EXHAUSTED (never empty success).
# Override: CC_STORAGE_SERVE_QUEUE_TIMEOUT_MS=2000
serve_queue_timeout_ms = 2000

# ── CC-46a five prune passes / watermarks (Architecture §7.0 / §7.4) ──────────
# Cadence: column pass every N epochs (shares snapshot tick; = column shard width).
# Override: CC_STORAGE_PRUNE_COLUMNS_EPOCHS=32
prune_columns_epochs = 32
# Cadence: block (+ state_roots) pass every N epochs (= block shard width).
# Override: CC_STORAGE_PRUNE_BLOCKS_EPOCHS=256
prune_blocks_epochs = 256
# One-epoch serve-side margin baked into both watermarks (§7.1).
# Override: CC_STORAGE_PRUNE_MARGIN_EPOCHS=1
prune_margin_epochs = 1
# Disk watermark: **alarm only, never a trigger** (§7.4 / §9.3).
# 75 % of the 128 GiB provision = 96 GiB. Operator acts on the alarm.
# Override: CC_STORAGE_DISK_ALARM_BYTES=...
disk_alarm_bytes = 103079215104
# Wall-clock genesis for prune epoch ticks (spec delta 9).
# Hoodi = MIN_GENESIS_TIME(1742212800) + GENESIS_DELAY(600) = 1742213400.
# When unset, resolved from the network fixture, then from a store snapshot's
# BeaconState.genesis_time. Override: CC_STORAGE_GENESIS_TIME=...
genesis_time = 1742213400


# CC-4D / Architecture §10.4 — dangerous knobs (config, not env).
# Uncomment only on the self-devnet; startup refuses unless
# genesis_validators_root is neither Hoodi's nor mainnet's.
# See devnet/retention-compressed.toml for the compressed-retention venue.
#
# genesis_validators_root = "0x…"   # required when either knob below is set
#
# [retention_override]
# columns_epochs = 64
# blocks_epochs  = 256
#
# [debug]
# crash_point = "after_put_before_commit"

[peers]
chain = "http://127.0.0.1:9001"
